name: build

on:
  push:
    branches: [master]
    tags: ['dsh-*']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      with_plugins:
        description: '集成第三方插件（plugins/，构建带 -plugins 后缀的镜像）'
        type: boolean
        default: false
      release:
        description: '创建 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        run: |
          set -u
          pinned=$(node -p "require('./package.json').dshVersion")
          upstream=$(npm view @deepseek-ai/dsh version)
          plugins='${{ inputs.with_plugins && '1' || '0' }}'
          case "$plugins" in 1) suffix='-plugins' ;; *) plugins=0; suffix='' ;; esac
          { echo "pinned=$pinned"; echo "upstream=$upstream"; echo "plugins=$plugins"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned upstream=$upstream plugins=$plugins"

      - name: Build image
        run: |
          docker build \
            --build-arg DSH_VERSION=${{ steps.v.outputs.pinned }} \
            --build-arg WITH_PLUGINS=${{ steps.v.outputs.plugins }} \
            -t "ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}" .

      - name: Smoke test
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker run --rm --entrypoint dsh "$IMG" --version
          if [ "${{ steps.v.outputs.plugins }}" = "0" ]; then
            docker run --rm --entrypoint sh "$IMG" -lc 'test -z "$(ls -A /opt/plugins)" && echo "no plugins bundled: ok"'
          else
            docker run --rm --entrypoint sh "$IMG" -lc 'test -d /opt/plugins/dsh-armor-gen5 && echo "plugins bundled: ok"'
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push GHCR
        run: |
          OWNER=${{ github.repository_owner }}
          VER=${{ steps.v.outputs.pinned }}
          SUF=${{ steps.v.outputs.suffix }}
          IMG="ghcr.io/$OWNER/dsh:$VER$SUF"
          docker push "$IMG"
          if [ "${{ steps.v.outputs.plugins }}" = "1" ]; then ALIAS=latest-plugins; else ALIAS=latest; fi
          docker tag "$IMG" "ghcr.io/$OWNER/dsh:$ALIAS"
          docker push "ghcr.io/$OWNER/dsh:$ALIAS"

      - name: Release
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/dsh-'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dsh-${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --title "$TAG" --notes "DSH ${{ steps.v.outputs.pinned }} · plugins: ${{ steps.v.outputs.plugins == '1' && 'integrated' || 'none' }} — docker pull $IMG"
          fi
