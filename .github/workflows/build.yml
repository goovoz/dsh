name: build

on:
  push:
    branches: [master]
    tags: ["dsh-*"]
    paths-ignore:
      - "**.md"
      - "compose.yaml"
      - "compose.build.yaml"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      # 每个插件一个勾选框：全勾 = 全部插件，全不勾 = 不带插件（不再需要 all/none 选项）
      dsh_infinite_gen_n:
        description: "dsh-infinite-gen-n  ·  破甲插件（无限N代）"
        type: boolean
        default: true
      qinglong_cli:
        description: "qinglong-cli  ·  青龙面板客户端"
        type: boolean
        default: true
      dsh_armor_gen5:
        description: "dsh-armor-gen5  ·  已退役（与 gen-n 预设冲突，仅回退时勾选）"
        type: boolean
        default: false
      release:
        description: "创建 GitHub Release"
        type: boolean
        default: true

# 同一 ref 上串行构建：避免 push 与 dispatch 并发时互相覆盖同一个 tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要能查/推 tag

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve versions
        id: v
        run: |
          set -u
          pinned=$(node -p "require('./package.json').dshVersion")
          upstream=$(npm view @deepseek-ai/dsh version)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel=""
            case "${{ inputs.dsh_infinite_gen_n }}" in true) sel="$sel,dsh-infinite-gen-n" ;; esac
            case "${{ inputs.qinglong_cli }}" in true) sel="$sel,qinglong-cli" ;; esac
            case "${{ inputs.dsh_armor_gen5 }}" in true) sel="$sel,dsh-armor-gen5" ;; esac
            plugins=${sel#,}
            [ -n "$plugins" ] || plugins=none
          else
            plugins=all
          fi
          suffix=$(bash scripts/resolve-plugins.sh suffix "$plugins")
          spec=$(bash scripts/resolve-plugins.sh spec "$plugins")
          { echo "pinned=$pinned"; echo "upstream=$upstream"; echo "plugins=$plugins"; echo "suffix=$suffix"; echo "spec=$spec"; } >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned upstream=$upstream plugins=$plugins"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push (linux/amd64 + linux/arm64)
        run: |
          OWNER=${{ github.repository_owner }}
          VER=${{ steps.v.outputs.pinned }}
          SUF=${{ steps.v.outputs.suffix }}
          TAG_ARGS="-t ghcr.io/$OWNER/dsh:$VER$SUF"
          case "$SUF" in
            -plugins) TAG_ARGS="$TAG_ARGS -t ghcr.io/$OWNER/dsh:latest-plugins -t ghcr.io/$OWNER/dsh:latest" ;;
            '')       TAG_ARGS="$TAG_ARGS -t ghcr.io/$OWNER/dsh:latest" ;;
            *)        echo "[tag] 非完整集（$SUF），只打版本 tag，不动 latest*" ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg DSH_VERSION="$VER" \
            --build-arg WITH_PLUGINS="${{ steps.v.outputs.plugins }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            $TAG_ARGS \
            --push .

      - name: Smoke test amd64
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker run --rm --platform linux/amd64 --entrypoint dsh "$IMG" --version
          SPEC="${{ steps.v.outputs.spec }}"   # 已解析成具体插件名（push 事件下 plugins=all）
          echo "plugins=$SPEC"
          if [ "$SPEC" = "none" ]; then
            docker run --rm --platform linux/amd64 --entrypoint sh "$IMG" -lc 'test -z "$(ls -A /opt/plugins)" && echo "amd64: no plugins bundled: ok"'
          else
            for name in $(printf '%s' "$SPEC" | tr ',' ' '); do
              docker run --rm --platform linux/amd64 --entrypoint sh "$IMG" -lc "test -d /opt/plugins/$name && echo \"amd64: $name bundled: ok\""
            done
            case "$SPEC" in
              *dsh-armor-gen5*) ;;
              *) docker run --rm --platform linux/amd64 --entrypoint sh "$IMG" -lc 'test ! -d /opt/plugins/dsh-armor-gen5 && echo "amd64: retired dsh-armor-gen5 not bundled: ok"' ;;
            esac
          fi

      - name: Smoke test arm64 (QEMU)
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker run --rm --platform linux/arm64 --entrypoint sh "$IMG" -lc "uname -m; dsh --version"

      - name: Smoke test container (gateway + PUBLIC_HOST guard)
        run: |
          set -u
          OWNER=${{ github.repository_owner }}
          VER=${{ steps.v.outputs.pinned }}
          SUF=${{ steps.v.outputs.suffix }}
          IMG="ghcr.io/$OWNER/dsh:$VER$SUF"
          # 1) 占位 PUBLIC_HOST 必须被拒绝（exit 64，且不会无限重启）
          set +e
          docker run --rm --platform linux/amd64 -e PUBLIC_HOST=192.168.1.1:8899 "$IMG" >/tmp/guard.log 2>&1
          rc=$?
          set -e
          if [ "$rc" != "64" ]; then echo "placeholder PUBLIC_HOST 未被拒绝: rc=$rc"; cat /tmp/guard.log; exit 1; fi
          echo "placeholder rejected: ok"
          # 2) 正确配置下网关返回 302（自动登录跳转）
          docker rm -f smoke >/dev/null 2>&1 || true
          docker run -d --name smoke --platform linux/amd64 -p 18899:8899 -e PUBLIC_HOST=127.0.0.1:18899 -e DSH_ALLOW_LOOPBACK=1 -e DSH_EXTRAS=0 "$IMG" >/dev/null
          code=000
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18899/ || true)
            if [ "$code" = "302" ]; then break; fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -5 || true
          docker rm -f smoke >/dev/null 2>&1 || true
          echo "gateway=$code"
          if [ "$code" != "302" ]; then echo "网关未返回 302"; exit 1; fi

      - name: Tag dsh-<ver>[-plugins] if new
        id: tag
        run: |
          set -u
          TAG="dsh-${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "created=0" >> "$GITHUB_OUTPUT"
            echo "tag $TAG 已存在，跳过"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "created=1" >> "$GITHUB_OUTPUT"
            echo "已创建 tag $TAG"
          fi

      - name: Manifest summary
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker buildx imagetools inspect "$IMG" | sed -n "1,20p"

      - name: Release
        if: |
          github.event_name != 'pull_request' && (
            steps.tag.outputs.created == '1' ||
            startsWith(github.ref, 'refs/tags/dsh-') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dsh-${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在"
          else
            gh release create "$TAG" --title "$TAG" --notes "DSH ${{ steps.v.outputs.pinned }} · plugins: ${{ steps.v.outputs.plugins != 'none' && 'integrated' || 'none' }} · platforms: linux/amd64, linux/arm64 — docker pull --platform linux/arm64 $IMG"
          fi
