name: build

on:
  push:
    branches: [master]
    tags: ["dsh-*"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      with_plugins:
        description: "集成第三方插件（plugins/，构建带 -plugins 后缀的镜像）"
        type: boolean
        default: false
      release:
        description: "创建 GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要能查/推 tag

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve versions
        id: v
        run: |
          set -u
          pinned=$(node -p "require('./package.json').dshVersion")
          upstream=$(npm view @deepseek-ai/dsh version)
          plugins='${{ inputs.with_plugins && '1' || '0' }}'
          case "$plugins" in 1) suffix="-plugins" ;; *) plugins=0; suffix="" ;; esac
          { echo "pinned=$pinned"; echo "upstream=$upstream"; echo "plugins=$plugins"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned upstream=$upstream plugins=$plugins"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push (linux/amd64 + linux/arm64)
        run: |
          OWNER=${{ github.repository_owner }}
          VER=${{ steps.v.outputs.pinned }}
          SUF=${{ steps.v.outputs.suffix }}
          if [ "${{ steps.v.outputs.plugins }}" = "1" ]; then ALIAS=latest-plugins; else ALIAS=latest; fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg DSH_VERSION="$VER" \
            --build-arg WITH_PLUGINS="${{ steps.v.outputs.plugins }}" \
            -t "ghcr.io/$OWNER/dsh:$VER$SUF" \
            -t "ghcr.io/$OWNER/dsh:$ALIAS" \
            --push .

      - name: Smoke test amd64
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker run --rm --platform linux/amd64 --entrypoint dsh "$IMG" --version
          if [ "${{ steps.v.outputs.plugins }}" = "0" ]; then
            docker run --rm --platform linux/amd64 --entrypoint sh "$IMG" -lc 'test -z "$(ls -A /opt/plugins)" && echo "amd64: no plugins bundled: ok"'
          else
            docker run --rm --platform linux/amd64 --entrypoint sh "$IMG" -lc 'test -d /opt/plugins/dsh-armor-gen5 && echo "amd64: plugins bundled: ok"'
          fi

      - name: Smoke test arm64 (QEMU)
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker run --rm --platform linux/arm64 --entrypoint sh "$IMG" -lc "uname -m; dsh --version"

      - name: Tag dsh-<ver>[-plugins] if new
        id: tag
        run: |
          set -u
          TAG="dsh-${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "created=0" >> "$GITHUB_OUTPUT"
            echo "tag $TAG 已存在，跳过"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "created=1" >> "$GITHUB_OUTPUT"
            echo "已创建 tag $TAG"
          fi

      - name: Manifest summary
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          docker buildx imagetools inspect "$IMG" | sed -n "1,20p"

      - name: Release
        if: |
          github.event_name != 'pull_request' && (
            steps.tag.outputs.created == '1' ||
            startsWith(github.ref, 'refs/tags/dsh-') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dsh-${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          IMG="ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.v.outputs.pinned }}${{ steps.v.outputs.suffix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在"
          else
            gh release create "$TAG" --title "$TAG" --notes "DSH ${{ steps.v.outputs.pinned }} · plugins: ${{ steps.v.outputs.plugins == '1' && 'integrated' || 'none' }} · platforms: linux/amd64, linux/arm64 — docker pull --platform linux/arm64 $IMG"
          fi
