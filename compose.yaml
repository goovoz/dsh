# DSH Web —— 浏览器访问的 DeepSeekRuntime（运行编排，只管「跑哪个镜像」）
#
# 构建不在这里：
#   make build                    本地构建（tag: dsh-web:<ver>[-plugins]）
#   make ghcr                     多架构构建并推送 GHCR
#   想用 compose 构建：docker compose -f compose.yaml -f compose.build.yaml build
#
# 运行：
#   make up                       用本地构建的镜像（Makefile 注入 IMAGE_TAG）
#   docker compose up -d          用发布镜像（默认 ghcr.io/goovoz/dsh:latest，多架构）
services:
  dsh-web:
    image: ${IMAGE_TAG:-ghcr.io/goovoz/dsh:latest}
    container_name: ${CONTAINER_NAME:-dsh-web}
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-8899}:8899"
    environment:
      # 必填：浏览器实际访问的 host[:port]（含端口）。默认值只是占位，容器会拒绝启动并提示你改
      PUBLIC_HOST: ${PUBLIC_HOST:-192.168.1.1:8899}
      HOME: /data/workspace
      DSH_HOME: /data/dsh
      DSH_WORKSPACE: /data/workspace
      # 运行期开关，默认交给镜像内置值：
      #   -plugins 镜像内置 DSH_PLUGINS=1、DSH_EXTRAS=1；普通镜像内置 0 / 1
      # 这里不写 DSH_PLUGINS，避免把 -plugins 镜像的默认值覆盖成 0；要覆盖就显式传：
      #   DSH_PLUGINS=0 docker compose up -d
      DSH_EXTRAS: ${DSH_EXTRAS:-1}
      TZ: ${TZ:-Asia/Shanghai}
    # compose >= 2.24 才支持 path/required 写法；老版本请删掉这段，改用 --env-file
    env_file:
      - path: ./secrets.env
        required: false
    volumes:
      - ./data:/data
    # bubblewrap 沙箱需要：解除 apparmor 的 userns 限制 + 允许创建命名空间
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    stop_grace_period: 20s
