# DSH Web —— 浏览器访问的 DeepSeekRuntime（运行编排，只管「跑哪个镜像」）
#
# 构建不在这里：
#   make build                    本地构建（tag: dsh-web:<ver>[-plugins]）
#   make ghcr                     多架构构建并推送 GHCR
#   想用 compose 构建：docker compose -f compose.yaml -f compose.build.yaml build
#
# 运行：
#   make up                       用本地构建的镜像（Makefile 注入 IMAGE_TAG）
#   docker compose up -d          用发布镜像（默认 ghcr.io/goovoz/dsh:latest，多架构）
services:
  dsh-web:
    image: ${IMAGE_TAG:-ghcr.io/goovoz/dsh:latest}
    container_name: ${CONTAINER_NAME:-dsh-web}
    # 配置错误会 exit 64：用 on-failure 而不是 unless-stopped，避免占位 PUBLIC_HOST 触发无限重启
    restart: on-failure:5
    ports:
      # DSH_PORT 只写端口号（如 8899）。写成 127.0.0.1:8899 时 Docker 只把端口发布到宿主回环，
      # 其它机器访问 <宿主IP>:8899 会直接 Connection refused（浏览器表现为转圈或打不开），
      # 而 `docker ps` 的 Ports 列会显示 127.0.0.1:8899->8899/tcp。
      - "${DSH_PORT:-8899}:8899"
    environment:
      # 【必填】浏览器实际访问的 host[:port]（也接受 https://host/ 这种完整 URL，入口会拆出 scheme）
      # 这里故意用 192.168.1.1:8899 作占位：它不是可用地址，入口会直接拒绝并 exit 64，提醒你改成真实值。
      # 真实值举例：192.168.1.10:8899（宿主机局域网 IP） / app.example.com（反代域名）
      PUBLIC_HOST: ${PUBLIC_HOST:-192.168.1.1:8899}
      HOME: /data/workspace
      DSH_HOME: /data/dsh
      DSH_WORKSPACE: /data/workspace
      # 运行期开关，默认交给镜像内置值：
      #   -plugins 镜像内置 DSH_PLUGINS=<插件列表或 all>、DSH_EXTRAS=1；none 镜像内置 0 / 1
      # 这里不写 DSH_PLUGINS，避免把 -plugins 镜像的默认值覆盖成 0；要覆盖就显式传：
      #   DSH_PLUGINS=0 docker compose up -d
      DSH_EXTRAS: ${DSH_EXTRAS:-1}
      # 【可选，默认 0】只放宽上面那条「回环地址拒绝」：置 1 后才允许 PUBLIC_HOST 用 127.0.0.1 / localhost。
      # 与上面的占位值无关：192.168.1.1 无论这个开关是 0 还是 1 都会被拒绝。
      # 本机自测的完整写法是两者一起给：PUBLIC_HOST=127.0.0.1:<端口> + DSH_ALLOW_LOOPBACK=1
      # （PUBLIC_HOST 仍然必填，不能只设这个开关。）
      # 必须在此声明，否则宿主 env（shell / .env）不会传进容器。
      DSH_ALLOW_LOOPBACK: ${DSH_ALLOW_LOOPBACK:-0}
      # 【可选，默认 1】给 llm-pi-ai 的模型补 input: [ text, image ]（图片输入能力）。
      # 置 0 关闭；只对个别模型关闭用 DSH_VISION_EXCLUDE="cn:xxx,cn:yyy"。
      DSH_ENABLE_VISION: ${DSH_ENABLE_VISION:-1}
      DSH_VISION_EXCLUDE: ${DSH_VISION_EXCLUDE:-}
      TZ: ${TZ:-Asia/Shanghai}
    # compose >= 2.24 才支持 path/required 写法；老版本请删掉这段，改用 --env-file
    env_file:
      - path: ./secrets.env
        required: false
    volumes:
      - ./data:/data
    # bubblewrap 沙箱需要：解除 apparmor 的 userns 限制 + 允许创建命名空间
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8899/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 180s   # 首次启动要下载 extras，给足时间
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 20s
