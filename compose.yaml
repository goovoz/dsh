# DSH Web —— 浏览器访问的 DeepSeekRuntime（容器部署）
#
# 两条路都能起：
#   1) make build && make up          本地构建（IMAGE_TAG 由 Makefile 注入，带 -plugins 后缀也一致）
#   2) docker compose up -d           直接拉发布镜像（默认 ghcr.io/goovoz/dsh:latest，多架构）
services:
  dsh-web:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.2-rc.1}
        WITH_EXTRAS: ${WITH_EXTRAS:-1}
        WITH_PLUGINS: ${WITH_PLUGINS:-0}
    # 默认指向已发布的多架构镜像；make up 会注入本地构建出的完整 tag
    image: ${IMAGE_TAG:-ghcr.io/goovoz/dsh:latest}
    container_name: ${CONTAINER_NAME:-dsh-web}
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-8899}:8899"
    environment:
      # 浏览器实际访问的 authority（含端口）；cookie 按它签名，改了要一起改
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1:8899}
      HOME: /data/workspace
      DSH_HOME: /data/dsh
      DSH_WORKSPACE: /data/workspace
      DSH_EXTRAS: ${WITH_EXTRAS:-1}
      DSH_PLUGINS: ${WITH_PLUGINS:-0}
      TZ: ${TZ:-Asia/Shanghai}
    # compose >= 2.24 才支持 path/required 写法；老版本请删掉这段，改用 --env-file
    env_file:
      - path: ./secrets.env
        required: false
    volumes:
      - ./data:/data
    # bubblewrap 沙箱需要：解除 apparmor 的 userns 限制 + 允许创建命名空间
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    stop_grace_period: 20s
