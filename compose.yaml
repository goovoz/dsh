# DSH Web —— 浏览器访问的 DeepSeekRuntime（运行编排，只管「跑哪个镜像」）
#
# 构建不在这里：
#   make build                    本地构建（tag: dsh-web:<ver>[-plugins]）
#   make ghcr                     多架构构建并推送 GHCR
#   想用 compose 构建：docker compose -f compose.yaml -f compose.build.yaml build
#
# 运行：
#   make up                       用本地构建的镜像（Makefile 注入 IMAGE_TAG）
#   docker compose up -d          用发布镜像（默认 ghcr.io/goovoz/dsh:latest，多架构）
services:
  dsh-web:
    image: ${IMAGE_TAG:-ghcr.io/goovoz/dsh:latest}
    container_name: ${CONTAINER_NAME:-dsh-web}
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-8899}:8899"
    environment:
      # 可留空：网关按来访 Host 自动适配；显式设置则固定为该 authority
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HOME: /data/workspace
      DSH_HOME: /data/dsh
      DSH_WORKSPACE: /data/workspace
      DSH_EXTRAS: ${WITH_EXTRAS:-1}
      DSH_PLUGINS: ${WITH_PLUGINS:-0}
      TZ: ${TZ:-Asia/Shanghai}
    # compose >= 2.24 才支持 path/required 写法；老版本请删掉这段，改用 --env-file
    env_file:
      - path: ./secrets.env
        required: false
    volumes:
      - ./data:/data
    # bubblewrap 沙箱需要：解除 apparmor 的 userns 限制 + 允许创建命名空间
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    stop_grace_period: 20s
